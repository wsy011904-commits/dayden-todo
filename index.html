<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAYDEN TODO v7.4</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #f8fafc;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* 창이 아무리 넓어져도 가로 390px 고정 */
    .app-card {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      background: #ffffff;
      margin: 0 auto 0 0; /* 왼쪽 상단 고정 */
      padding: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e2e8f0;
      box-shadow: 4px 0 15px rgba(0, 0, 0, 0.03);
    }

    .title-bar {
      background: linear-gradient(135deg, #fbcfe8 0%, #fef08a 50%, #d9f99d 100%);
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.8);
      flex-shrink: 0;
    }

    .banner-container {
      width: 100%;
      height: 170px;
      background-color: #f1f5f9;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      flex-shrink: 0;
    }

    .banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .banner-hover-text {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .banner-container:hover .banner-hover-text {
      opacity: 1;
    }

    .calendar-body {
      padding: 16px;
      flex: 1;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 0 8px;
    }

    .nav-arrow {
      color: #f43f5e;
      font-size: 16px;
      cursor: pointer;
      user-select: none;
      padding: 4px 8px;
      opacity: 0.6;
    }
    .nav-arrow:hover { opacity: 1; }

    .current-month {
      font-size: 24px;
      font-weight: 800;
      color: #f43f5e;
      letter-spacing: -0.5px;
      font-family: serif;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      row-gap: 2px;
    }

    .day-label {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      padding-bottom: 10px;
    }
    .day-label.sun { color: #f43f5e; }
    .day-label.sat { color: #3b82f6; }

    .date-cell {
      height: 58px;
      border-right: 1px solid #f1f5f9;
      border-bottom: 1px solid #f1f5f9;
      padding: 3px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      cursor: pointer;
      overflow: hidden;
    }

    .date-cell.drag-over {
      background-color: #f1f5f9;
      border: 1px dashed #94a3b8 !important;
    }

    .date-cell:nth-child(7n) { border-right: none; }

    .date-num {
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 2px;
      padding-left: 2px;
    }
    .date-num.other-month { color: #cbd5e1; }
    .date-num.sun { color: #f43f5e; }
    .date-num.sat { color: #3b82f6; }

    .date-cell.selected {
      border: 1.5px solid #f43f5e !important;
      border-radius: 6px;
    }

    .chip {
      width: 100%;
      height: 16px;
      border-radius: 8px;
      margin-bottom: 2px;
      background-color: #f0f6ff;
      font-size: 9px;
      color: #334155;
      padding: 0 4px;
      display: flex;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chip-icon {
      width: 9px;
      height: 9px;
      background-color: #fbcfe8;
      border-radius: 3px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 7px;
      color: #be185d;
    }

    .chip-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chip.completed { opacity: 0.6; }
    .chip.completed .chip-text {
      text-decoration: line-through;
      color: #94a3b8;
    }

    .bottom-panel {
      margin-top: 16px;
      background-color: #f8fafc;
      border-radius: 18px;
      padding: 14px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .panel-title {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
    }

    .panel-buttons {
      display: flex;
      gap: 6px;
    }

    .btn-add, .btn-img-change {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      padding: 5px 9px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
    }

    .panel-subtitle {
      font-size: 10px;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    .schedule-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .schedule-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
      cursor: pointer;
    }

    .schedule-title.completed {
      text-decoration: line-through;
      color: #94a3b8;
    }

    .button-group {
      display: flex;
      gap: 4px;
    }

    .btn-action {
      background: transparent;
      border: none;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      padding: 2px 4px;
    }

    .btn-action.edit { color: #0284c7; }
    .btn-action.delete { color: #f43f5e; }
  </style>
</head>
<body>

<div class="app-card">
  <div class="title-bar">
    🪶 ✿ DAYDEN TODO v7.4 ✿
  </div>

  <div class="banner-container" id="bannerBtn">
    <img src="https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=500&auto=format&fit=crop" id="bannerImg" class="banner-img" alt="Banner">
    <div class="banner-hover-text">📷 클릭하여 이미지 변경</div>
  </div>

  <input type="file" id="imageInput" accept="image/*" style="display: none;">

  <div class="calendar-body">
    <div class="calendar-header">
      <span class="nav-arrow" id="prevMonth">&lt;</span>
      <span class="current-month" id="currentMonthText">2026.08</span>
      <span class="nav-arrow" id="nextMonth">&gt;</span>
    </div>

    <div class="calendar-grid">
      <div class="day-label sun">일</div>
      <div class="day-label">월</div>
      <div class="day-label">화</div>
      <div class="day-label">수</div>
      <div class="day-label">목</div>
      <div class="day-label">금</div>
      <div class="day-label sat">토</div>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>

    <div class="bottom-panel">
      <div class="panel-header">
        <span class="panel-title" id="panelTitle">27일 일정</span>
        <div class="panel-buttons">
          <button class="btn-img-change" id="btnChangeImage">🖼️ 이미지 변경</button>
          <button class="btn-add" id="btnAdd">+ 추가</button>
        </div>
      </div>
      <div class="panel-subtitle">자동 데이터 저장 기능이 적용되었습니다</div>
      <div id="scheduleList"></div>
    </div>
  </div>
</div>

<script>
  let currentDate = new Date(2026, 7, 1);
  let selectedDateStr = '2026-08-27';
  let draggedScheduleId = null;

  const defaultSchedules = [
    { id: 1, title: 'ㄹ로ㅅ', startDate: '2026-08-27', endDate: '2026-08-27', completed: false }
  ];
  let schedules = JSON.parse(localStorage.getItem('dayden_schedules')) || defaultSchedules;

  const currentMonthText = document.getElementById('currentMonthText');
  const calendarGrid = document.getElementById('calendarGrid');
  const panelTitle = document.getElementById('panelTitle');
  const scheduleList = document.getElementById('scheduleList');
  const imageInput = document.getElementById('imageInput');
  const bannerImg = document.getElementById('bannerImg');

  const savedImage = localStorage.getItem('dayden_banner_v2');
  if (savedImage) {
    bannerImg.src = savedImage;
  }

  function saveData() {
    localStorage.setItem('dayden_schedules', JSON.stringify(schedules));
  }

  document.getElementById('bannerBtn').addEventListener('click', () => imageInput.click());
  document.getElementById('btnChangeImage').addEventListener('click', () => imageInput.click());

  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = 600;
          canvas.height = 300;
          ctx.drawImage(img, 0, 0, 600, 300);
          
          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.8);
          bannerImg.src = compressedDataUrl;
          try {
            localStorage.setItem('dayden_banner_v2', compressedDataUrl);
          } catch (err) {
            alert('이미지 용량이 너무 큽니다. 다른 이미지를 선택해 주세요.');
          }
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }
  });

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    currentMonthText.textContent = `${year}.${String(month + 1).padStart(2, '0')}`;
    calendarGrid.innerHTML = '';

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const prevLastDate = new Date(year, month, 0).getDate();

    for (let i = firstDay - 1; i >= 0; i--) {
      calendarGrid.appendChild(createDateCell(prevLastDate - i, true));
    }

    for (let i = 1; i <= lastDate; i++) {
      const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
      const dayOfWeek = new Date(year, month, i).getDay();
      
      const cell = createDateCell(i, false, dateKey, dayOfWeek);
      if (dateKey === selectedDateStr) cell.classList.add('selected');
      calendarGrid.appendChild(cell);
    }

    const totalCells = firstDay + lastDate;
    const nextDays = (totalCells > 35 ? 42 : 35) - totalCells;
    for (let i = 1; i <= nextDays; i++) {
      calendarGrid.appendChild(createDateCell(i, true));
    }

    renderSchedules();
  }

  function createDateCell(num, isOther, dateKey = null, dayOfWeek = null) {
    const cell = document.createElement('div');
    cell.className = 'date-cell';

    const numSpan = document.createElement('span');
    numSpan.className = 'date-num';
    numSpan.textContent = num;

    if (isOther) {
      numSpan.classList.add('other-month');
      cell.appendChild(numSpan);
      return cell;
    }

    if (dayOfWeek === 0) numSpan.classList.add('sun');
    if (dayOfWeek === 6) numSpan.classList.add('sat');

    cell.appendChild(numSpan);

    cell.addEventListener('dragover', (e) => {
      e.preventDefault();
      cell.classList.add('drag-over');
    });

    cell.addEventListener('dragleave', () => {
      cell.classList.remove('drag-over');
    });

    cell.addEventListener('drop', (e) => {
      e.preventDefault();
      cell.classList.remove('drag-over');
      if (draggedScheduleId) {
        moveScheduleToDate(draggedScheduleId, dateKey);
      }
    });

    const activeSchedules = schedules.filter(s => dateKey >= s.startDate && dateKey <= s.endDate);
    activeSchedules.forEach(s => {
      const chip = document.createElement('div');
      chip.className = `chip ${s.completed ? 'completed' : ''}`;
      chip.draggable = true;

      chip.innerHTML = `
        <span class="chip-icon">${s.completed ? '✓' : '-'}</span>
        <span class="chip-text">${s.title}</span>
      `;

      chip.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleComplete(s.id);
      });

      chip.addEventListener('dragstart', () => {
        draggedScheduleId = s.id;
      });

      cell.appendChild(chip);
    });

    cell.addEventListener('click', () => {
      document.querySelectorAll('.date-cell').forEach(c => c.classList.remove('selected'));
      cell.classList.add('selected');
      selectedDateStr = dateKey;
      renderSchedules();
    });

    return cell;
  }

  function toggleComplete(id) {
    const target = schedules.find(s => s.id === id);
    if (target) {
      target.completed = !target.completed;
      saveData();
      renderCalendar();
    }
  }

  function moveScheduleToDate(id, newStartDateStr) {
    const target = schedules.find(s => s.id === id);
    if (!target) return;

    const start = new Date(target.startDate);
    const end = new Date(target.endDate);
    const diffDays = Math.round((end - start) / (1000 * 60 * 60 * 24));

    const newStart = new Date(newStartDateStr);
    const newEnd = new Date(newStart);
    newEnd.setDate(newStart.getDate() + diffDays);

    target.startDate = newStartDateStr;
    target.endDate = `${newEnd.getFullYear()}-${String(newEnd.getMonth() + 1).padStart(2, '0')}-${String(newEnd.getDate()).padStart(2, '0')}`;

    draggedScheduleId = null;
    saveData();
    renderCalendar();
  }

  function renderSchedules() {
    const [y, m, d] = selectedDateStr.split('-');
    panelTitle.textContent = `${parseInt(d)}일 일정`;
    scheduleList.innerHTML = '';

    const list = schedules.filter(s => selectedDateStr >= s.startDate && selectedDateStr <= s.endDate);

    if (list.length === 0) {
      scheduleList.innerHTML = '<div class="schedule-card" style="color:#94a3b8; font-size:13px;">일정이 없습니다.</div>';
      return;
    }

    list.forEach(item => {
      const card = document.createElement('div');
      card.className = 'schedule-card';
      card.innerHTML = `
        <div class="schedule-title ${item.completed ? 'completed' : ''}" onclick="toggleComplete(${item.id})">
          <span class="chip-icon">${item.completed ? '✓' : '-'}</span>
          ${item.title}
        </div>
        <div class="button-group">
          <button class="btn-action edit" onclick="editSchedule(${item.id})">수정</button>
          <button class="btn-action delete" onclick="deleteSchedule(${item.id})">삭제</button>
        </div>
      `;
      scheduleList.appendChild(card);
    });
  }

  document.getElementById('prevMonth').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  });

  document.getElementById('nextMonth').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  });

  document.getElementById('btnAdd').addEventListener('click', () => {
    const title = prompt('일정 이름을 입력하세요:', '새 일정');
    if (!title) return;

    const days = prompt('며칠 동안 진행되나요? (1이면 하루)', '1');
    if (!days || isNaN(days)) return;

    const start = new Date(selectedDateStr);
    const end = new Date(start);
    end.setDate(start.getDate() + (parseInt(days) - 1));

    const endDateStr = `${end.getFullYear()}-${String(end.getMonth() + 1).padStart(2, '0')}-${String(end.getDate()).padStart(2, '0')}`;

    schedules.push({
      id: Date.now(),
      title,
      startDate: selectedDateStr,
      endDate: endDateStr,
      completed: false
    });

    saveData();
    renderCalendar();
  });

  function editSchedule(id) {
    const target = schedules.find(s => s.id === id);
    if (!target) return;

    const newTitle = prompt('일정 이름을 수정하세요:', target.title);
    if (!newTitle) return;

    target.title = newTitle;
    saveData();
    renderCalendar();
  }

  function deleteSchedule(id) {
    if (confirm('일정을 삭제하시겠습니까?')) {
      schedules = schedules.filter(i => i.id !== id);
      saveData();
      renderCalendar();
    }
  }

  renderCalendar();
</script>

</body>
</html>
